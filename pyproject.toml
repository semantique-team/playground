[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playground"
version = "0.1.0"
description = "HTTP server and web playground for ANT decision-model checkpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ant-4b @ git+https://github.com/semantique-team/ant-4b.git",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["serve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
